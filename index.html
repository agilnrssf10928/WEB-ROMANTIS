<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #ffe0ef 0%, #f8d5ff 50%, #e0d5ff 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
  padding: 20px;
  position: relative;
}

/* ===== AWAN BERGERAK ===== */
.cloud {
  position: fixed;
  font-size: 60px;
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
  user-select: none;
}

.cloud-1 { top: 10%; animation: cloudMove 25s linear infinite; }
.cloud-2 { top: 25%; font-size: 80px; animation: cloudMove 35s linear infinite; animation-delay: -10s; }
.cloud-3 { top: 60%; font-size: 50px; animation: cloudMove 30s linear infinite; animation-delay: -18s; }
.cloud-4 { top: 75%; animation: cloudMove 40s linear infinite; animation-delay: -5s; }

@keyframes cloudMove {
  from { left: -150px; }
  to { left: 110vw; }
}

/* ===== WINNIE THE POOH ===== */
.pooh {
  position: fixed;
  font-size: 80px;
  bottom: 20px;
  left: 20px;
  z-index: 5;
  pointer-events: none;
  animation: poohBounce 3s ease-in-out infinite;
  filter: drop-shadow(0 10px 20px rgba(255, 100, 150, 0.4));
}

@keyframes poohBounce {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-30px) rotate(5deg); }
}

.pooh-2 {
  position: fixed;
  font-size: 60px;
  bottom: 20px;
  right: 20px;
  z-index: 5;
  pointer-events: none;
  animation: poohBounce2 4s ease-in-out infinite;
  filter: drop-shadow(0 10px 20px rgba(255, 100, 150, 0.4));
}

@keyframes poohBounce2 {
  0%, 100% { transform: translateY(0) scaleX(-1); }
  50% { transform: translateY(-25px) scaleX(-1); }
}

/* ===== LEBAH TERBANG ===== */
.bee {
  position: fixed;
  font-size: 30px;
  pointer-events: none;
  z-index: 6;
  user-select: none;
}

.bee-1 { top: 20%; animation: beeFly 12s linear infinite; }
.bee-2 { top: 45%; font-size: 25px; animation: beeFly 15s linear infinite; animation-delay: -5s; }
.bee-3 { top: 70%; font-size: 35px; animation: beeFly 18s linear infinite; animation-delay: -10s; }

@keyframes beeFly {
  0% { left: 100vw; transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-50px) rotate(-10deg); }
  50% { transform: translateY(30px) rotate(10deg); }
  75% { transform: translateY(-40px) rotate(-5deg); }
  100% { left: -100px; transform: translateY(0) rotate(0deg); }
}

/* ===== SPARKLE ===== */
.sparkle {
  position: fixed;
  font-size: 20px;
  pointer-events: none;
  z-index: 3;
  animation: sparkleAnim 2s ease-in-out infinite;
}

@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
  50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
}

/* ===== BUNGA DI CARD ===== */
.flower {
  position: absolute;
  font-size: 35px;
  pointer-events: none;
  z-index: 15;
  animation: flowerSway 4s ease-in-out infinite;
}

.flower-1 { top: -20px; left: -20px; }
.flower-2 { top: -20px; right: -20px; animation-delay: 1s; }
.flower-3 { bottom: -20px; left: -20px; animation-delay: 2s; }
.flower-4 { bottom: -20px; right: -20px; animation-delay: 3s; }

@keyframes flowerSway {
  0%, 100% { transform: rotate(-15deg) scale(1); }
  50% { transform: rotate(15deg) scale(1.15); }
}

/* ===== HATI BACKGROUND ===== */
.heart-bg {
  position: fixed;
  top: -50px;
  font-size: 20px;
  opacity: 0.5;
  animation: fall linear infinite;
  pointer-events: none;
  z-index: 1;
  user-select: none;
}

@keyframes fall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 0.7; }
  100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* ===== CARD ===== */
.card {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 30px;
  padding: 50px 40px;
  max-width: 700px;
  width: 100%;
  text-align: center;
  box-shadow:
    0 20px 60px rgba(255, 105, 180, 0.4),
    0 0 100px rgba(255, 200, 100, 0.2);
  position: relative;
  z-index: 10;
  border: 3px solid #ffd4a8;
  animation: cardBounce 6s ease-in-out infinite;
}

@keyframes cardBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.title {
  font-size: 2rem;
  background: linear-gradient(135deg, #ff4d94, #ffa726, #b966ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  margin-bottom: 15px;
  line-height: 1.3;
}

.subtitle {
  color: #a855a8;
  font-size: 1rem;
  margin-bottom: 25px;
  font-weight: 500;
  line-height: 1.6;
}

/* Tombol musik */
.music-btn {
  background: rgba(255, 255, 255, 0.9);
  color: #ff4d94;
  border: 2px solid #ff4d94;
  padding: 12px 28px;
  border-radius: 50px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
  letter-spacing: 0.5px;
}

.music-btn:hover {
  background: #ff4d94;
  color: white;
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 10px 25px rgba(255, 77, 148, 0.5);
}

.music-btn.playing .music-icon {
  animation: musicPulse 1s infinite;
}

@keyframes musicPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

/* Tombol pencet */
.btn-pencet {
  background: linear-gradient(135deg, #ff4d94, #ffa726, #b966ff);
  background-size: 200% 200%;
  color: white;
  border: none;
  padding: 18px 45px;
  border-radius: 50px;
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 30px rgba(255, 77, 148, 0.5);
  letter-spacing: 0.5px;
  animation: btnShine 3s ease infinite;
}

@keyframes btnShine {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.btn-pencet:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 15px 40px rgba(255, 77, 148, 0.7);
}

.surprise-box {
  max-height: 0;
  overflow: hidden;
  transition: max-height 1.2s ease, opacity 1s ease, margin-top 1s ease;
  opacity: 0;
  margin-top: 0;
}

.surprise-box.show {
  max-height: 2500px;
  opacity: 1;
  margin-top: 40px;
}

.ucapan {
  font-size: 1.15rem;
  color: #6b3a8f;
  line-height: 1.8;
  margin-bottom: 30px;
  font-weight: 500;
  padding: 0 10px;
}

.ucapan strong {
  background: linear-gradient(135deg, #ff4d94, #ffa726);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  font-size: 1.3rem;
}

/* ===== SLIDESHOW ===== */
.slideshow-container {
  position: relative;
  max-width: 100%;
  width: 500px;
  margin: 0 auto;
  border-radius: 20px;
  overflow: hidden;
  background: #ffd6e8;
  box-shadow: 0 20px 50px rgba(255, 77, 148, 0.5);
  border: 4px solid transparent;
  background-clip: padding-box;
}

.slideshow-container::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 24px;
  padding: 4px;
  background: linear-gradient(135deg, #ff4d94, #ffa726, #b966ff);
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: 5;
}

.slide {
  display: none;
  width: 100%;
  aspect-ratio: 4 / 5;
  position: relative;
  background: #ffd6e8;
}

.slide.active {
  display: block;
  animation: slideFade 0.6s ease;
}

@keyframes slideFade {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.slide-caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  color: white;
  padding: 30px 20px 15px;
  font-size: 0.95rem;
  font-weight: 600;
  text-align: left;
  pointer-events: none;
}

/* ===== NAVIGASI PANAH ===== */
.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255, 255, 255, 0.9);
  color: #ff4d94;
  border: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.5rem;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  z-index: 10;
  box-shadow: 0 5px 20px rgba(0,0,0,0.25);
}

.nav-btn:hover {
  background: #ff4d94;
  color: white;
  transform: translateY(-50%) scale(1.15);
}

.nav-btn.prev { left: 15px; }
.nav-btn.next { right: 15px; }

/* ===== DOT INDICATOR ===== */
.dots-container {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 10;
  background: rgba(0,0,0,0.4);
  padding: 8px 14px;
  border-radius: 50px;
  backdrop-filter: blur(5px);
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  cursor: pointer;
  transition: all 0.3s;
  border: none;
  padding: 0;
}

.dot.active {
  background: #ffa726;
  width: 28px;
  border-radius: 5px;
  box-shadow: 0 0 10px #ffa726;
}

/* ===== VIDEO ===== */
.video-slide {
  position: relative;
}

.video-slide video {
  cursor: pointer;
  background: #000;
}

.video-badge {
  position: absolute;
  top: 15px;
  right: 15px;
  background: linear-gradient(135deg, #ff4d94, #ffa726);
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 1px;
  z-index: 5;
  animation: badgePulse 2s infinite;
}

@keyframes badgePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

/* Pesan error video */
.video-error {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ffc2dd, #d5b8ff);
  color: white;
  font-size: 1.2rem;
  font-weight: 700;
  text-align: center;
  padding: 30px;
  gap: 15px;
}

.video-error .icon {
  font-size: 4rem;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* ===== HATI BESAR ===== */
.big-heart {
  position: fixed;
  font-size: 100px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  pointer-events: none;
  z-index: 100;
  animation: heartPop 1.5s ease;
}

@keyframes heartPop {
  0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
  50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
}

@media (max-width: 600px) {
  .card { padding: 35px 20px; border-radius: 25px; }
  .title { font-size: 1.5rem; }
  .subtitle { font-size: 0.9rem; margin-bottom: 20px; }
  .music-btn { padding: 10px 22px; font-size: 0.85rem; margin-bottom: 20px; }
  .btn-pencet { padding: 15px 35px; font-size: 1rem; }
  .ucapan { font-size: 1rem; }
  .slideshow-container { width: 100%; }
  .nav-btn { width: 38px; height: 38px; font-size: 1.2rem; }
  .nav-btn.prev { left: 8px; }
  .nav-btn.next { right: 8px; }
  .slide-caption { font-size: 0.85rem; padding: 25px 15px 12px; }
  .dots-container { padding: 6px 10px; }
  .dot { width: 8px; height: 8px; }
  .dot.active { width: 22px; }
  .pooh { font-size: 50px; bottom: 10px; left: 10px; }
  .pooh-2 { font-size: 40px; bottom: 10px; right: 10px; }
  .bee { font-size: 20px; }
  .cloud { font-size: 40px; }
  .flower { font-size: 25px; }
}
</style>
</head>
<body>

<!-- Awan bergerak -->
<div class="cloud cloud-1">☁️</div>
<div class="cloud cloud-2">☁️</div>
<div class="cloud cloud-3">☁️</div>
<div class="cloud cloud-4">☁️</div>

<!-- Winnie the Pooh -->
<div class="pooh">🐻</div>
<div class="pooh-2">🐻</div>

<!-- Lebah terbang -->
<div class="bee bee-1">🐝</div>
<div class="bee bee-2">🐝</div>
<div class="bee bee-3">🐝</div>

<!-- Sparkle -->
<div class="sparkle" style="top: 15%; left: 10%;">✨</div>
<div class="sparkle" style="top: 40%; right: 15%; animation-delay: 0.5s;">✨</div>
<div class="sparkle" style="top: 75%; left: 20%; animation-delay: 1s;">✨</div>
<div class="sparkle" style="top: 85%; right: 25%; animation-delay: 1.5s;">✨</div>
<div class="sparkle" style="top: 30%; left: 45%; animation-delay: 0.8s;">✨</div>

<div class="card">
  <!-- Bunga di pojok card -->
  <div class="flower flower-1">🌸</div>
  <div class="flower flower-2">🌺</div>
  <div class="flower flower-3">🌷</div>
  <div class="flower flower-4">🌻</div>

  <h1 class="title">Hai Sayang 🐻</h1>
  <p class="subtitle">
    Ada sesuatu nih buat kamu...<br>
    Pencet tombol di bawah ya! 💕
  </p>

  <button class="music-btn" id="musicBtn">
    <span class="music-icon">▶</span>
    <span id="musicText">Putar Musik</span>
  </button>

  <br>

  <button class="btn-pencet" id="btnPencet">Pencet Aku 💌</button>

  <div class="surprise-box" id="surpriseBox">
    <p class="ucapan" id="ucapanText"></p>

    <!-- ===== SLIDESHOW ===== -->
    <div class="slideshow-container" id="slideshow">

      <!-- Slide 1 -->
      <div class="slide active">
        <img src="foto1.jpg" alt="Kenangan 1"
             onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc2dd,#d5b8ff);color:white;font-size:3rem;font-weight:bold;&quot;>🌸 FOTO 1 🌸</div>'">
        <div class="slide-caption">Momen pertama kita ❤</div>
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <img src="foto2.jpg" alt="Kenangan 2"
             onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc2dd,#d5b8ff);color:white;font-size:3rem;font-weight:bold;&quot;>🌺 FOTO 2 🌺</div>'">
        <div class="slide-caption">Senyum manis kamu 😊</div>
      </div>

      <!-- Slide 3 -->
      <div class="slide">
        <img src="foto3.jpg" alt="Kenangan 3"
             onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc2dd,#d5b8ff);color:white;font-size:3rem;font-weight:bold;&quot;>🌷 FOTO 3 🌷</div>'">
        <div class="slide-caption">Selalu cantik 💕</div>
      </div>

      <!-- Slide 4 -->
      <div class="slide">
        <img src="foto4.jpg" alt="Kenangan 4"
             onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc2dd,#d5b8ff);color:white;font-size:3rem;font-weight:bold;&quot;>🌻 FOTO 4 🌻</div>'">
        <div class="slide-caption">Momen yang gak akan aku lupain ✨</div>
      </div>

      <!-- Slide 5 -->
      <div class="slide">
        <img src="foto5.jpg" alt="Kenangan 5"
             onerror="this.parentElement.innerHTML='<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffc2dd,#d5b8ff);color:white;font-size:3rem;font-weight:bold;&quot;>💕 FOTO 5 💕</div>'">
        <div class="slide-caption">Bersamamu selalu indah 💖</div>
      </div>

      <!-- Slide 6: VIDEO -->
      <div class="slide video-slide">
        <span class="video-badge">🎬 VIDEO</span>
        <video id="videoPlayer" controls playsinline preload="metadata">
          <source src="video.mp4" type="video/mp4">
          Browser kamu tidak mendukung video.
        </video>
        <div class="slide-caption">Video spesial buat kamu 🎬</div>
      </div>

      <!-- Navigasi -->
      <button class="nav-btn prev" id="prevBtn" aria-label="Sebelumnya">‹</button>
      <button class="nav-btn next" id="nextBtn" aria-label="Selanjutnya">›</button>

      <!-- Dot indicators -->
      <div class="dots-container" id="dotsContainer"></div>

    </div>
  </div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="lagu-romantis.mp3" type="audio/mpeg">
</audio>

<script>
// ============================================================
// EDIT UCAPAN DI SINI
// ============================================================
var ucapan = "Hai sayang... 🐻<br><br>Makasih ya udah jadi bagian terindah di hidup aku.<br>Setiap hari sama kamu itu kayak mimpi yang jadi nyata.<br>Aku sayang kamu, hari ini, besok, dan selamanya.<br><br><strong>I Love You 💖</strong>";

// ============================================================
// JANGAN EDIT DI BAWAH INI
// ============================================================

var btn = document.getElementById('btnPencet');
var surpriseBox = document.getElementById('surpriseBox');
var ucapanText = document.getElementById('ucapanText');
var bgMusic = document.getElementById('bgMusic');
var musicBtn = document.getElementById('musicBtn');
var musicText = document.getElementById('musicText');
var musicIcon = musicBtn.querySelector('.music-icon');
var isPlaying = false;

// ===== TOMBOL MUSIK =====
musicBtn.addEventListener('click', function() {
  if (isPlaying) {
    bgMusic.pause();
    isPlaying = false;
    musicBtn.classList.remove('playing');
    musicIcon.textContent = '▶';
    musicText.textContent = 'Putar Musik';
  } else {
    bgMusic.volume = 0.5;
    var playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      playPromise.then(function() {
        isPlaying = true;
        musicBtn.classList.add('playing');
        musicIcon.textContent = '❚❚';
        musicText.textContent = 'Jeda Musik';
      }).catch(function(error) {
        console.log('Gagal play musik:', error);
      });
    }
  }
});

// ===== TOMBOL PENCET =====
btn.addEventListener('click', function() {
  ucapanText.innerHTML = ucapan;
  surpriseBox.classList.add('show');
  btn.style.opacity = '0';
  btn.style.transform = 'scale(0.8)';
  setTimeout(function() {
    btn.style.display = 'none';
  }, 400);

  if (!isPlaying) {
    bgMusic.volume = 0.5;
    var playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      playPromise.then(function() {
        isPlaying = true;
        musicBtn.classList.add('playing');
        musicIcon.textContent = '❚❚';
        musicText.textContent = 'Jeda Musik';
      }).catch(function(error) {
        console.log('Autoplay gagal:', error);
      });
    }
  }

  showBigHeart();
  setTimeout(heartBurst, 300);

  setTimeout(function() {
    surpriseBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 500);
});

// ===== CEK VIDEO BISA DIPUTAR GAK =====
var videoPlayer = document.getElementById('videoPlayer');
if (videoPlayer) {
  videoPlayer.addEventListener('error', function() {
    console.log('Video error, mungkin file gak ada atau format salah');
    var videoSlide = videoPlayer.parentElement;
    videoPlayer.style.display = 'none';
    var errorDiv = document.createElement('div');
    errorDiv.className = 'video-error';
    errorDiv.innerHTML = '<div class="icon">🎬</div><div>Video belum di-upload<br><small style="opacity:0.8;font-weight:400;">Taro file video.mp4 di folder yang sama</small></div>';
    videoSlide.insertBefore(errorDiv, videoSlide.firstChild);
  });
}

// ============================================================
// SLIDESHOW LOGIC
// ============================================================
var slides = document.querySelectorAll('.slide');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var dotsContainer = document.getElementById('dotsContainer');
var currentSlide = 0;
var autoSlideInterval;

for (var i = 0; i < slides.length; i++) {
  var dot = document.createElement('button');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.setAttribute('aria-label', 'Slide ' + (i + 1));
  (function(index) {
    dot.addEventListener('click', function() {
      goToSlide(index);
      resetAutoSlide();
    });
  })(i);
  dotsContainer.appendChild(dot);
}

var dots = document.querySelectorAll('.dot');

function showSlide(n) {
  if (n >= slides.length) currentSlide = 0;
  else if (n < 0) currentSlide = slides.length - 1;
  else currentSlide = n;

  slides.forEach(function(slide) {
    slide.classList.remove('active');
    var video = slide.querySelector('video');
    if (video && !video.paused) {
      video.pause();
    }
  });

  slides[currentSlide].classList.add('active');

  dots.forEach(function(dot, i) {
    dot.classList.toggle('active', i === currentSlide);
  });
}

function goToSlide(n) { showSlide(n); }
function nextSlide() { showSlide(currentSlide + 1); }
function prevSlide() { showSlide(currentSlide - 1); }

function startAutoSlide() {
  autoSlideInterval = setInterval(function() {
    var currentSlideEl = slides[currentSlide];
    var video = currentSlideEl.querySelector('video');
    if (video && !video.paused) return;
    nextSlide();
  }, 8000);
}

function stopAutoSlide() { clearInterval(autoSlideInterval); }
function resetAutoSlide() { stopAutoSlide(); startAutoSlide(); }

prevBtn.addEventListener('click', function() {
  prevSlide();
  resetAutoSlide();
});

nextBtn.addEventListener('click', function() {
  nextSlide();
  resetAutoSlide();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') { prevSlide(); resetAutoSlide(); }
  else if (e.key === 'ArrowRight') { nextSlide(); resetAutoSlide(); }
});

var touchStartX = 0;
var touchEndX = 0;
var slideshow = document.getElementById('slideshow');

slideshow.addEventListener('touchstart', function(e) {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

slideshow.addEventListener('touchend', function(e) {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  var swipeDistance = touchEndX - touchStartX;
  if (Math.abs(swipeDistance) > 50) {
    if (swipeDistance < 0) nextSlide();
    else prevSlide();
    resetAutoSlide();
  }
}

startAutoSlide();
